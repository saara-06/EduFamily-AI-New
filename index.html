
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#11111b">
  <meta name="description" content="Hira AI - Your friendly AI study, coding and career companion.">
  <title>Hira AI — Your AI Companion</title>

  <style>
    :root {
      --bg: #0d0d16;
      --sidebar: #12121e;
      --panel: #191927;
      --panel2: #222235;
      --text: #f5f4ff;
      --muted: #a3a1bb;
      --accent: #a78bfa;
      --accent2: #7c5ce7;
      --border: rgba(255,255,255,.09);
      --user: #30264c;
      --danger: #ff7777;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .app {
      display: flex;
      height: 100dvh;
      width: 100%;
    }

    .sidebar {
      width: 270px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 18px 13px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      transition: transform .25s ease;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 5px 7px 22px;
    }

    .brand-icon {
      width: 43px;
      height: 43px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      font-size: 23px;
      background: linear-gradient(135deg, #c4b5fd, #7c3aed);
      box-shadow: 0 5px 24px #8b5cf633;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
    }

    .new-chat {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      transition: background .2s;
    }

    .new-chat:hover {
      background: var(--panel2);
    }

    .section-label {
      margin: 25px 9px 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.3px;
    }

    .history-list {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 10px 9px;
      margin-bottom: 4px;
      border-radius: 9px;
      color: var(--muted);
      font-size: 13px;
    }

    .history-item.active,
    .history-item:hover {
      color: var(--text);
      background: var(--panel2);
    }

    .history-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
      min-width: 0;
    }

    .delete-chat {
      border: 0;
      color: var(--muted);
      background: transparent;
      padding: 4px;
      border-radius: 6px;
    }

    .delete-chat:hover {
      color: var(--danger);
      background: #ff77771a;
    }

    .sidebar-footer {
      padding: 13px 7px 2px;
      border-top: 1px solid var(--border);
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6ee7a0;
      margin-right: 6px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
      position: relative;
    }

    .topbar {
      min-height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: #0d0d16eF;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-title {
      font-size: 14px;
      font-weight: 700;
    }

    .top-subtitle {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel);
      color: var(--text);
      display: grid;
      place-items: center;
      font-size: 17px;
    }

    .icon-btn:hover {
      background: var(--panel2);
    }

    .menu-btn {
      display: none;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 26px 18px 32px;
      scroll-behavior: smooth;
    }

    .welcome {
      max-width: 780px;
      min-height: 100%;
      margin: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px 0 50px;
    }

    .welcome-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: center;
      padding: 7px 13px;
      border-radius: 30px;
      border: 1px solid #a78bfa40;
      background: #a78bfa10;
      color: #c4b5fd;
      font-size: 12px;
      margin-bottom: 22px;
    }

    .welcome h1 {
      text-align: center;
      font-size: clamp(32px, 5vw, 49px);
      line-height: 1.15;
      letter-spacing: -1.5px;
      margin: 0;
    }

    .gradient-text {
      background: linear-gradient(90deg, #c4b5fd, #f0abfc, #a5b4fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .welcome p {
      text-align: center;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
      max-width: 480px;
      margin: 17px auto 28px;
    }

    .prompt-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 4px;
    }

    .prompt-card {
      text-align: left;
      padding: 16px;
      border-radius: 15px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      transition: transform .2s, border-color .2s, background .2s;
    }

    .prompt-card:hover {
      transform: translateY(-2px);
      border-color: #a78bfa77;
      background: #211d32;
    }

    .prompt-icon {
      font-size: 21px;
      margin-bottom: 10px;
    }

    .prompt-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .prompt-description {
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
    }

    .message-row {
      max-width: 820px;
      margin: 0 auto 24px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 16px;
      background: linear-gradient(135deg, #a78bfa, #6d43ca);
    }

    .avatar.user-avatar {
      background: #303044;
      font-size: 14px;
    }

    .message-content {
      flex: 1;
      min-width: 0;
      padding-top: 2px;
    }

    .message-author {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #c4b5fd;
    }

    .user-row .message-author {
      color: #ddd6fe;
    }

    .message-text {
      font-size: 14px;
      line-height: 1.8;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .user-row .message-text {
      display: inline-block;
      padding: 11px 15px;
      border-radius: 4px 15px 15px 15px;
      background: var(--user);
    }

    .message-text pre {
      position: relative;
      overflow-x: auto;
      padding: 15px;
      margin: 12px 0;
      border-radius: 10px;
      background: #090911;
      border: 1px solid var(--border);
      white-space: pre;
      font-size: 12px;
      line-height: 1.6;
    }

    .message-text code {
      font-family: Consolas, "Courier New", monospace;
      font-size: .92em;
    }

    .message-text :not(pre) > code {
      background: #a78bfa20;
      border-radius: 5px;
      padding: 2px 5px;
    }

    .message-text h1,
    .message-text h2,
    .message-text h3 {
      font-size: 16px;
      margin: 15px 0 7px;
    }

    .message-text ul,
    .message-text ol {
      padding-left: 22px;
    }

    .message-text a {
      color: #c4b5fd;
      overflow-wrap: anywhere;
    }

    .copy-code {
      position: absolute;
      top: 7px;
      right: 7px;
      padding: 5px 8px;
      border: 1px solid var(--border);
      background: #242438;
      color: var(--text);
      border-radius: 6px;
      font-size: 11px;
    }

    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 0;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce .9s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: .5; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    .composer-area {
      padding: 10px 18px 16px;
      background: linear-gradient(transparent, var(--bg) 20%);
    }

    .composer-wrap {
      max-width: 820px;
      margin: auto;
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 11px 12px;
      border: 1px solid #a78bfa48;
      background: var(--panel);
      border-radius: 17px;
      box-shadow: 0 8px 35px #0002;
    }

    .composer:focus-within {
      border-color: #a78bfa99;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      max-height: 180px;
      resize: none;
      outline: none;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
      padding: 5px 3px;
    }

    #messageInput::placeholder {
      color: #77758f;
    }

    .send-btn {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #b5a0ff, #845ce7);
      color: white;
      font-size: 18px;
      transition: opacity .2s;
    }

    .send-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .composer-note {
      text-align: center;
      color: #77758f;
      font-size: 10px;
      margin-top: 10px;
    }

    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      padding: 11px 16px;
      border-radius: 10px;
      background: #29283b;
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 12px;
      box-shadow: 0 8px 25px #0004;
      z-index: 30;
      max-width: calc(100% - 30px);
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    .overlay {
      display: none;
    }

    @media (max-width: 760px) {
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        width: min(290px, 85vw);
        box-shadow: 10px 0 35px #0004;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .overlay.visible {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 9;
        background: #0009;
      }

      .menu-btn {
        display: grid;
      }

      .topbar {
        padding: 10px 13px;
      }

      .messages {
        padding: 22px 13px;
      }

      .composer-area {
        padding: 8px 10px 12px;
      }

      .welcome {
        justify-content: center;
        padding: 15px 0 25px;
      }

      .welcome h1 {
        font-size: 34px;
      }

      .prompt-grid {
        gap: 9px;
      }

      .prompt-card {
        padding: 12px;
      }

      .prompt-description {
        font-size: 11px;
      }

      .message-row {
        gap: 9px;
        margin-bottom: 20px;
      }

      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 10px;
      }

      .message-text {
        font-size: 13px;
      }
    }

    @media (max-width: 370px) {
      .prompt-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div id="overlay" class="overlay" onclick="toggleSidebar(false)"></div>

    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <div class="brand-icon">✦</div>
        <div>
          <div class="brand-name">Hira AI</div>
          <div class="brand-sub">Your AI companion</div>
        </div>
      </div>

      <button class="new-chat" id="newChatButton">
        <span>＋</span> New chat
      </button>

      <div class="section-label">Recent chats</div>
      <div id="historyList" class="history-list"></div>

      <div class="sidebar-footer">
        <div><span class="status-dot"></span><span id="statusText">Connecting to Hira...</span></div>
        <div>Made with 💜 for your growth</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="top-left">
          <button class="icon-btn menu-btn" id="menuButton" aria-label="Open menu">☰</button>
          <div>
            <div class="top-title">Hira AI</div>
            <div class="top-subtitle">Study · Coding · Career · Ideas</div>
          </div>
        </div>
        <button class="icon-btn" id="clearButton" title="Clear this chat" aria-label="Clear this chat">⌫</button>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <div class="composer-area">
        <div class="composer-wrap">
          <form id="chatForm" class="composer">
            <textarea
              id="messageInput"
              rows="1"
              maxlength="12000"
              placeholder="Message Hira..."
              aria-label="Your message"
              required
            ></textarea>
            <button class="send-btn" id="sendButton" type="submit" aria-label="Send message">↑</button>
          </form>
          <div class="composer-note">Enter to send · Shift + Enter for a new line</div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script>
    "use strict";

    const API_BASE = "https://hira-ai-1iiz.onrender.com";
    const STORAGE_KEY = "hiraAI_chats_v2";
    const SESSION_KEY = "hiraAI_currentSession_v2";

    const messagesElement = document.getElementById("messages");
    const inputElement = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const formElement = document.getElementById("chatForm");
    const historyList = document.getElementById("historyList");
    const statusText = document.getElementById("statusText");
    const toastElement = document.getElementById("toast");

    let chats = loadChats();
    let currentSessionId = localStorage.getItem(SESSION_KEY) || "";
    let busy = false;
    let toastTimer = null;

    function createId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }

      return "hira-" + Date.now() + "-" +
        Math.random().toString(36).slice(2, 12);
    }

    function loadChats() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(saved) ? saved.filter(chat =>
          chat &&
          typeof chat.id === "string" &&
          Array.isArray(chat.messages)
        ) : [];
      } catch {
        return [];
      }
    }

    function saveChats() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
        if (currentSessionId) {
          localStorage.setItem(SESSION_KEY, currentSessionId);
        } else {
          localStorage.removeItem(SESSION_KEY);
        }
      } catch {
        showToast("Browser storage is full. Some history may not save.");
      }
    }

    function getCurrentChat() {
      return chats.find(chat => chat.id === currentSessionId) || null;
    }

    function createChat() {
      const chat = {
        id: createId(),
        title: "New chat",
        messages: [],
        updatedAt: Date.now()
      };

      chats.unshift(chat);
      currentSessionId = chat.id;
      saveChats();
      renderHistory();
      renderMessages();
      inputElement.focus();
      toggleSidebar(false);
    }

    function showToast(message) {
      toastElement.textContent = message;
      toastElement.classList.remove("hidden");

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastElement.classList.add("hidden");
      }, 3500);
    }

    function toggleSidebar(force) {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");

      const shouldOpen = typeof force === "boolean"
        ? force
        : !sidebar.classList.contains("open");

      sidebar.classList.toggle("open", shouldOpen);
      overlay.classList.toggle("visible", shouldOpen);
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function formatInline(text) {
      let safe = escapeHTML(text);

      safe = safe.replace(
        /`([^`\n]+)`/g,
        "<code>$1</code>"
      );

      safe = safe.replace(
        /\*\*(.+?)\*\*/g,
        "<strong>$1</strong>"
      );

      safe = safe.replace(
        /(^|[^*])\*([^*\n]+)\*/g,
        "$1<em>$2</em>"
      );

      safe = safe.replace(
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        function (_match, label, url) {
          const safeUrl = escapeHTML(url);
          return '<a href="' + safeUrl +
            '" target="_blank" rel="noopener noreferrer">' +
            label + "</a>";
        }
      );

      return safe;
    }

    function renderMarkdown(value) {
      const lines = String(value).replace(/\r\n/g, "\n").split("\n");
      let html = "";
      let inCode = false;
      let codeLines = [];
      let listType = "";
      let paragraph = [];

      function flushParagraph() {
        if (paragraph.length) {
          html += "<p>" +
            paragraph.map(formatInline).join("<br>") +
            "</p>";
          paragraph = [];
        }
      }

      function closeList() {
        if (listType) {
          html += listType === "ul" ? "</ul>" : "</ol>";
          listType = "";
        }
      }

      for (const line of lines) {
        if (line.trim().startsWith("```")) {
          flushParagraph();
          closeList();

          if (inCode) {
            html += '<pre><button class="copy-code" type="button">Copy</button><code>' +
              escapeHTML(codeLines.join("\n")) +
              "</code></pre>";
            codeLines = [];
            inCode = false;
          } else {
            inCode = true;
          }

          continue;
        }

        if (inCode) {
          codeLines.push(line);
          continue;
        }

        if (!line.trim()) {
          flushParagraph();
          closeList();
          continue;
        }

        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          closeList();
          const level = heading[1].length;
          html += "<h" + level + ">" +
            formatInline(heading[2]) +
            "</h" + level + ">";
          continue;
        }

        const unordered = line.match(/^\s*[-*]\s+(.+)$/);
        const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);

        if (unordered || ordered) {
          flushParagraph();
          const type = unordered ? "ul" : "ol";

          if (listType && listType !== type) {
            closeList();
          }

          if (!listType) {
            listType = type;
            html += type === "ul" ? "<ul>" : "<ol>";
          }

          html += "<li>" +
            formatInline((unordered || ordered)[1]) +
            "</li>";
          continue;
        }

        paragraph.push(line);
      }

      if (inCode) {
        html += "<pre><code>" +
          escapeHTML(codeLines.join("\n")) +
          "</code></pre>";
      }

      flushParagraph();
      closeList();

      return html || escapeHTML(value);
    }

    function renderMessages() {
      const chat = getCurrentChat();

      if (!chat || chat.messages.length === 0) {
        messagesElement.innerHTML = `
          <div class="welcome">
            <div class="welcome-badge">✦ Your personal AI companion</div>
            <h1>Hey there!<br><span class="gradient-text">What shall we learn today?</span></h1>
            <p>I'm Hira, your study buddy for coding, college, AI projects and career goals. Ask me anything!</p>

            <div class="prompt-grid">
              <button class="prompt-card" data-prompt="Teach me Python from the basics with simple examples.">
                <div class="prompt-icon">🐍</div>
                <div class="prompt-title">Learn Python</div>
                <div class="prompt-description">Start coding with easy examples.</div>
              </button>

              <button class="prompt-card" data-prompt="Help me build an impressive beginner AI project step by step.">
                <div class="prompt-icon">🤖</div>
                <div class="prompt-title">Build an AI project</div>
                <div class="prompt-description">Turn an idea into a working project.</div>
              </button>

              <button class="prompt-card" data-prompt="Create a realistic weekly study plan for college, DSA and programming.">
                <div class="prompt-icon">📚</div>
                <div class="prompt-title">Plan my studies</div>
                <div class="prompt-description">Make study time more productive.</div>
              </button>

              <button class="prompt-card" data-prompt="Help me prepare for an internship with a beginner-friendly roadmap.">
                <div class="prompt-icon">🚀</div>
                <div class="prompt-title">Career & internships</div>
                <div class="prompt-description">Work towards internship readiness.</div>
              </button>
            </div>
          </div>
        `;
        return;
      }

      messagesElement.innerHTML = chat.messages.map(message => {
        const isUser = message.role === "user";

        return `
          <div class="message-row ${isUser ? "user-row" : "assistant-row"}">
            <div class="avatar ${isUser ? "user-avatar" : ""}">
              ${isUser ? "👤" : "✦"}
            </div>
            <div class="message-content">
              <div class="message-author">${isUser ? "You" : "Hira"}</div>
              <div class="message-text">${renderMarkdown(message.content)}</div>
            </div>
          </div>
        `;
      }).join("");

      if (busy) {
        messagesElement.insertAdjacentHTML("beforeend", `
          <div class="message-row" id="typingIndicator">
            <div class="avatar">✦</div>
            <div class="message-content">
              <div class="message-author">Hira</div>
              <div class="typing"><span></span><span></span><span></span></div>
            </div>
          </div>
        `);
      }

      messagesElement.scrollTop = messagesElement.scrollHeight;
    }

    function renderHistory() {
      chats.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

      historyList.innerHTML = "";

      if (chats.length === 0) {
        const empty = document.createElement("div");
        empty.textContent = "No chats yet";
        empty.style.cssText = "padding:10px;color:var(--muted);font-size:12px";
        historyList.appendChild(empty);
        return;
      }

      chats.forEach(chat => {
        const item = document.createElement("div");
        item.className = "history-item" +
          (chat.id === currentSessionId ? " active" : "");

        const title = document.createElement("div");
        title.className = "history-title";
        title.textContent = chat.title || "New chat";
        title.title = chat.title || "New chat";
        title.onclick = () => openChat(chat.id);

        const remove = document.createElement("button");
        remove.className = "delete-chat";
        remove.type = "button";
        remove.title = "Delete chat";
        remove.setAttribute("aria-label", "Delete chat");
        remove.textContent = "×";
        remove.onclick = event => {
          event.stopPropagation();
          removeChat(chat.id);
        };

        item.append(title, remove);
        historyList.appendChild(item);
      });
    }

    function openChat(id) {
      if (busy) {
        showToast("Please wait for Hira's reply first.");
        return;
      }

      if (!chats.some(chat => chat.id === id)) return;

      currentSessionId = id;
      saveChats();
      renderHistory();
      renderMessages();
      toggleSidebar(false);
    }

    async function removeChat(id) {
      if (busy && id === currentSessionId) {
        showToast("Please wait for the current reply.");
        return;
      }

      const chat = chats.find(item => item.id === id);
      if (!chat) return;

      const confirmed = window.confirm(
        "Delete this chat and its saved conversation?"
      );

      if (!confirmed) return;

      try {
        await fetch(
          API_BASE + "/history/" + encodeURIComponent(id),
          { method: "DELETE" }
        );
      } catch {
        // Local deletion still works if the server is offline.
      }

      chats = chats.filter(item => item.id !== id);

      if (currentSessionId === id) {
        currentSessionId = "";
      }

      saveChats();

      if (!currentSessionId && chats.length) {
        currentSessionId = chats[0].id;
      }

      if (!currentSessionId) {
        createChat();
        return;
      }

      saveChats();
      renderHistory();
      renderMessages();
      showToast("Chat deleted.");
    }

    async function clearCurrentChat() {
      if (busy) {
        showToast("Please wait for Hira's reply.");
        return;
      }

      const chat = getCurrentChat();

      if (!chat || chat.messages.length === 0) {
        showToast("This chat is already empty.");
        return;
      }

      if (!window.confirm("Clear all messages in this chat?")) {
        return;
      }

      const id = currentSessionId;

      try {
        await fetch(
          API_BASE + "/history/" + encodeURIComponent(id),
          { method: "DELETE" }
        );
      } catch {
        // Clear the local conversation even if the API is unavailable.
      }

      chat.messages = [];
      chat.title = "New chat";
      chat.updatedAt = Date.now();

      saveChats();
      renderHistory();
      renderMessages();
      showToast("Conversation cleared.");
    }

    function setBusy(value) {
      busy = value;
      sendButton.disabled = value;
      inputElement.disabled = value;
      sendButton.textContent = value ? "…" : "↑";
      renderMessages();
    }

    async function sendMessage(text) {
      const message = String(text || "").trim();

      if (!message || busy) return;

      if (message.length > 12000) {
        showToast("Please keep your message under 12,000 characters.");
        return;
      }

      if (!currentSessionId || !getCurrentChat()) {
        createChat();
      }

      const sessionAtStart = currentSessionId;
      const chat = getCurrentChat();

      chat.messages.push({
        role: "user",
        content: message
      });

      if (chat.title === "New chat") {
        chat.title = message.length > 38
          ? message.slice(0, 38) + "…"
          : message;
      }

      chat.updatedAt = Date.now();
      saveChats();
      renderHistory();

      inputElement.value = "";
      autoResizeInput();
      setBusy(true);

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 150000);

        let response;

        try {
          response = await fetch(API_BASE + "/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message,
              session_id: sessionAtStart
            }),
            signal: controller.signal
          });
        } finally {
          clearTimeout(timeoutId);
        }

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error("The server returned an invalid response.");
        }

        if (!response.ok) {
          throw new Error(data.error || "Hira could not reply. Please try again.");
        }

        const activeChat = chats.find(item => item.id === sessionAtStart);

        if (activeChat) {
          activeChat.messages.push({
            role: "assistant",
            content: data.reply || "I couldn't create a reply. Please try again."
          });

          activeChat.updatedAt = Date.now();
          saveChats();
        }

        statusText.textContent = "Connected";
      } catch (error) {
        let explanation = error.message || "Unknown error.";

        if (error.name === "AbortError") {
          explanation = "Hira took too long to respond. Please try sending your message again.";
        } else if (error instanceof TypeError) {
          explanation = "Could not connect to Hira's server. Check your internet and try again.";
        }

        const activeChat = chats.find(item => item.id === sessionAtStart);

        if (activeChat) {
          activeChat.messages.push({
            role: "assistant",
            content: "Sorry yaar, I couldn't complete that request.\n\n**Error:** " +
              explanation +
              "\n\nPlease try again in a moment."
          });

          activeChat.updatedAt = Date.now();
          saveChats();
        }

        statusText.textContent = "Connection issue";
      } finally {
        setBusy(false);
        renderHistory();
        renderMessages();

        if (currentSessionId === sessionAtStart) {
          inputElement.focus();
        }
      }
    }

    function autoResizeInput() {
      inputElement.style.height = "auto";
      inputElement.style.height =
        Math.min(inputElement.scrollHeight, 180) + "px";
    }

    async function checkServer() {
      try {
        const response = await fetch(API_BASE + "/health", {
          signal: AbortSignal.timeout(10000)
        });

        if (!response.ok) throw new Error("Server unavailable");

        const data = await response.json();

        if (data.status === "ok" && data.api_key_configured) {
          statusText.textContent = "Connected";
        } else if (data.status === "ok") {
          statusText.textContent = "API key missing";
        } else {
          statusText.textContent = "Server issue";
        }
      } catch {
        statusText.textContent = "Server waking up";
      }
    }

    formElement.addEventListener("submit", event => {
      event.preventDefault();
      sendMessage(inputElement.value);
    });

    inputElement.addEventListener("input", autoResizeInput);

    inputElement.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        formElement.requestSubmit();
      }
    });

    document.getElementById("newChatButton").addEventListener("click", () => {
      if (busy) {
        showToast("Wait for the current reply first.");
        return;
      }
      createChat();
    });

    document.getElementById("menuButton").addEventListener("click", () => {
      toggleSidebar();
    });

    document.getElementById("clearButton").addEventListener("click", clearCurrentChat);

    messagesElement.addEventListener("click", async event => {
      const prompt = event.target.closest("[data-prompt]");

      if (prompt) {
        sendMessage(prompt.dataset.prompt);
        return;
      }

      const copyButton = event.target.closest(".copy-code");

      if (copyButton) {
        const code = copyButton.parentElement.querySelector("code");

        try {
          await navigator.clipboard.writeText(code.textContent);
          copyButton.textContent = "Copied!";
          setTimeout(() => {
            copyButton.textContent = "Copy";
          }, 1500);
        } catch {
          showToast("Could not copy automatically. Select the code and copy it.");
        }
      }
    });

    if (!currentSessionId || !chats.some(chat => chat.id === currentSessionId)) {
      if (chats.length) {
        currentSessionId = chats[0].id;
      } else {
        const firstChat = {
          id: createId(),
          title: "New chat",
          messages: [],
          updatedAt: Date.now()
        };

        chats.unshift(firstChat);
        currentSessionId = firstChat.id;
      }
    }

    saveChats();
    renderHistory();
    renderMessages();
    checkServer();
  </script>
</body>
</html>
